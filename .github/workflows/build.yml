name: build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to publish a Release on tag pushes

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential meson ninja-build pkg-config \
            libarchive-dev libcurl4-openssl-dev libgpgme-dev \
            libssl-dev gettext

      - name: Configure (static libalpm, no docs)
        run: |
          meson setup build \
            -Ddoc=disabled \
            -Ddefault_library=static

      - name: Build
        run: |
          set -o pipefail
          ninja -C build 2>&1 | tee /tmp/build.log
          test -x build/pacman-remove

      - name: Verify our patched sources compiled with zero warnings
        run: |
          # upstream lib/libalpm has pre-existing const-discard warnings that
          # are not ours; only flag warnings in the files we touched.
          if grep -nE 'src/pacman/(util|pacman)\.c:[0-9]+:.*warning' /tmp/build.log; then
            echo "::error::pacman-remove sources produced compiler warnings"
            exit 1
          fi
          echo "zero warnings from our code"

      - name: Offline smoke tests (sandboxed, no network)
        run: bash .github/scripts/smoke.sh build/pacman-remove

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: pacman-remove-linux-x86_64
          path: build/pacman-remove
          if-no-files-found: error

      - name: Publish release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/pacman-remove
          generate_release_notes: true
          fail_on_unmatched_files: true